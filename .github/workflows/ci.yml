name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenBLAS
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev pkg-config
      - name: Locate clang-cl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $clang = Get-Command clang-cl -ErrorAction SilentlyContinue
          if (-not $clang -and (Test-Path "C:\Program Files\LLVM\bin\clang-cl.exe")) {
            echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
            $env:Path = "C:\Program Files\LLVM\bin;" + $env:Path
          }
          clang-cl --version
      - run: python -m pip install ".[test]"
      - run: python -m pytest

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[docs]"
      - run: sphinx-build -W -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
