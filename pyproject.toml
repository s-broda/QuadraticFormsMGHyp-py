[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "QuadraticFormsMGHyp"
version = "0.1.2"
description = "Tail probability and expected shortfall of a quadratic form in a multivariate generalized hyperbolic vector"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Simon Broda" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "generalized hyperbolic",
    "quadratic form",
    "expected shortfall",
    "tail probability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]
docs = ["sphinx>=7.2,<8", "myst-parser>=3,<4", "furo>=2024.1"]

[project.urls]
Homepage = "https://github.com/s-broda/QuadraticFormsMGHyp-py"
Documentation = "https://s-broda.github.io/QuadraticFormsMGHyp-py/"
Repository = "https://github.com/s-broda/QuadraticFormsMGHyp-py"
Changelog = "https://github.com/s-broda/QuadraticFormsMGHyp-py/blob/main/CHANGELOG.md"
Julia = "https://github.com/s-broda/QuadraticFormsMGHyp.jl"
Fortran = "https://github.com/s-broda/es4mgh"

[tool.cibuildwheel]
skip = [
    "pp*",
    "gp*",
    "*-win32",
    "*-*linux_i686",
    "cp3??t-*",
    # NumPy publishes Windows ARM64 wheels from Python 3.11.
    "cp39-win_arm64",
    "cp310-win_arm64",
]
test-extras = ["test"]
test-command = "pytest -q {project}/tests"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
QuadraticFormsMGHyp = ["py.typed"]

[tool.setuptools.exclude-package-data]
QuadraticFormsMGHyp = ["*.c"]
